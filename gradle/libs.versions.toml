[versions]

checker-framework = "4.2.1"

google-java-format = "1.28.0"

# The Groovy-Eclipse formatter.
# Spotless permits version 4.36 on JVM 17+ and version 4.40 on JVM 21+.
greclipse = "4.36"

jacoco = "0.8.14"

junit-jupiter = "6.1.2"

pmd = "7.26.0"

[libraries]

# Every entry uses the "module" table notation.  An entry uses "version.ref"
# when build.gradle also needs the version number by itself (via
# "libs.versions.*"), and an inline "version" otherwise.

# The build script uses only the version number of this library, via
# "libs.versions.checker.framework".  The library entry exists so that Renovate
# can determine the module coordinates and thus can update the version.
checker-framework = { module = "org.checkerframework:checker", version.ref = "checker-framework" }

error-prone-core = { module = "com.google.errorprone:error_prone_core", version = "2.50.0" }

# Version number is used, library is not; see the comment on "checker-framework" above.
google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }

# Version number is used, library is not; see the comment on "checker-framework" above.
# Gradle's JaCoCo plugin resolves "org.jacoco.agent" and "org.jacoco.ant", both
# of which are released in lockstep with the rest of JaCoCo.
jacoco = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

# The version comes from the junit-bom constraints that junit-jupiter brings in.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

options = { module = "org.plumelib:options", version = "3.0.0-SNAPSHOT" }

plume-util = { module = "org.plumelib:plume-util", version = "2.0.0-SNAPSHOT" }

# Version number is used, library is not; see the comment on "checker-framework" above.
pmd = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }

require-javadoc = { module = "org.plumelib:require-javadoc", version = "3.0.0-SNAPSHOT" }

[plugins]

com-diffplug-spotless = { id = "com.diffplug.spotless", version = "8.9.0" }

com-gradleup-shadow = { id = "com.gradleup.shadow", version = "9.6.1" }

net-ltgt-errorprone = { id = "net.ltgt.errorprone", version = "5.1.0" }

org-checkerframework = { id = "org.checkerframework", version = "1.0.2" }
