[plugins]

com-diffplug-spotless = { id = "com.diffplug.spotless", version = "8.8.0" }

com-gradleup-shadow = { id = "com.gradleup.shadow", version = "9.6.1" }

net-ltgt-errorprone = { id = "net.ltgt.errorprone", version = "5.1.0" }

org-checkerframework = { id = "org.checkerframework", version = "1.0.2" }

[versions]

checker-framework = "4.2.1"

google-java-format = "1.28.0"

jacoco = "0.8.14"

junit-jupiter = "6.1.2"

pmd = "7.26.0"

[libraries]

# The build script uses only the version number of this library, via
# "libs.versions.checker.framework".  The library entry exists so that Renovate
# can determine the module coordinates and thus can update the version.
checker-framework = { module = "org.checkerframework:checker", version.ref = "checker-framework" }

error-prone-core = "com.google.errorprone:error_prone_core:2.50.0"

# Version number is used, library is not; see the comment on "checker-framework" above.
google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }

# Version numbre is used, library is not; see the comment on "checker-framework" above.
jacoco = { module = "org.jacoco:org.jacoco.core", version.ref = "jacoco" }

junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }

# The version comes from the junit-bom constraints that junit-jupiter brings in.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

options = "org.plumelib:options:3.0.0-SNAPSHOT"

plume-util = "org.plumelib:plume-util:2.0.0-SNAPSHOT"

# Version numbre is used, library is not; see the comment on "checker-framework" above.
pmd = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }

require-javadoc = "org.plumelib:require-javadoc:3.0.0-SNAPSHOT"
