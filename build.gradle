plugins {
  id("java")
  id("application")

  // Creates the fat jar build/libs/...-all.jar as part of "assemble".
  // To create only that jar, run: ./gradlew shadowJar
  alias(libs.plugins.com.gradleup.shadow)

  // Code formatting; defines targets "spotlessApply" and "spotlessCheck"
  // which are run by "check" (which is itself run by "build").
  alias(libs.plugins.com.diffplug.spotless)

  // Error Prone linter
  alias(libs.plugins.net.ltgt.errorprone)

  // PMD linter
  id("pmd")

  // code coverage
  id("jacoco")

  // Checker Framework pluggable type-checking
  alias(libs.plugins.org.checkerframework)
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    url = "https://central.sonatype.com/repository/maven-snapshots/"
    // Only snapshots live here, so don't search this repository for releases.
    mavenContent { snapshotsOnly() }
  }
}

dependencies {
  implementation(libs.options)
  implementation(libs.plume.util)

  errorprone(libs.error.prone.core)

  testImplementation(libs.junit.jupiter)
  testRuntimeOnly(libs.junit.platform.launcher)
}

application {
  mainClass = "org.plumelib.lookup.Lookup"
}

// The "application" and "shadow" plugins each add a distribution -- a .tar and
// a .zip holding the jar, its dependencies, and start scripts -- to "assemble",
// which "build" runs.  This project ships jars rather than distributions, so
// writing about 8 MB of archives on every build is wasted work.
[
  "distTar",
  "distZip",
  "shadowDistTar",
  "shadowDistZip"
].each { taskName ->
  tasks.named(taskName) {
    enabled = false
  }
}

java {
  toolchain {
    // Always compile using Java 21, but test using various Java versions.
    // (The test task overrides this toolchain; see the "test" task below.)
    languageVersion = JavaLanguageVersion.of(21)
  }
}

tasks.withType(JavaCompile).configureEach {
  // Set the language level and byte code to 17.
  options.release = 17

  // Gradle compiles in a worker process whenever the toolchain above differs
  // from the JVM that runs Gradle.  That worker does not inherit the
  // `org.gradle.jvmargs` heap setting in gradle.properties, so set it here too.
  options.forkOptions.jvmArgs += "-Xmx6g"
  options.compilerArgs += "-Werror"
  // "-processing" avoids javac warning "No processor claimed any of these annotations".
  options.compilerArgs += "-Xlint:all,-processing"

  // Error Prone linter
  options.errorprone {
    disable("AnnotateFormatMethod") // Error Prone doesn't know about Checker Framework @FormatMethod.
    disable("DoNotCallSuggester") // Suggests use of an Error Prone annotation.
    disable("EffectivelyPrivate") // Loses information about the abstraction.
    disable("ExtendsObject")  // Incorrect when using the Checker Framework.
    disable("InlineMeSuggester") // Using `@InlineMe` requires clients to declare a dependency on error_prone_annotations.
    disable("ReferenceEquality") // Use Interning Checker instead.
  }
}

tasks.named("test", Test) {
  // Run the tests under the JVM that is running Gradle, rather than under the
  // Java 21 toolchain that is used for compilation.  Without this, every entry
  // of the continuous integration Java version matrix would test Java 21 only.
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(Runtime.version().feature())
  }

  outputs.upToDateWhen { false }
  outputs.cacheIf { false }

  useJUnitPlatform {
    includeEngines("junit-jupiter")
    excludeEngines("junit-vintage")
  }

  testLogging {
    showStandardStreams = true
    events("failed")
    exceptionFormat = "full"
  }

  // Generate the coverage report after the tests run.
  finalizedBy(tasks.named("jacocoTestReport"))
}

jacoco {
  toolVersion = libs.versions.jacoco.get()
}
tasks.named("jacocoTestReport", JacocoReport) {
  reports {
    xml.required = false
    csv.required = true // Output is written to build/reports/jacoco/test/jacocoTestReport.csv
    html.required = true // Output is written to build/reports/jacoco/test/html/index.html
  }
}

spotless {
  format "misc", {
    // define the files to apply `misc` to
    target("*.md", ".gitignore")

    // define the steps to apply to those files
    trimTrailingWhitespace()
    leadingTabsToSpaces(2)
    endWithNewline()
  }
  java {
    googleJavaFormat(libs.versions.google.java.format.get())
    formatAnnotations()
  }
  groovyGradle {
    target("**/*.gradle")

    greclipse()
        .cacheDirectory("${gradle.gradleUserHomeDir}/p2-data")
        .withP2Mirrors([
          "https://download.eclipse.org/": "https://mirror.umd.edu/eclipse/",
          // Groovy-Eclipse is published only here, so map this repository to itself.
          "https://groovy.jfrog.io/": "https://groovy.jfrog.io/",
        ])

    leadingTabsToSpaces(2)
    trimTrailingWhitespace()
    // endWithNewline() // Don't want to end empty files with a newline
  }
}


// PMD linter

pmd {
  toolVersion = libs.versions.pmd.get()
  ruleSetFiles = files("${rootDir}/.pmd-ruleset.xml")
  consoleOutput = true
}
tasks.named("pmdTest") {
  enabled = false
}


// Checker Framework pluggable type-checking

checkerFramework {
  version = libs.versions.checker.framework.get()
  checkers = [
    // No need to run CalledMethodsChecker, because ResourceLeakChecker does so.
    // "org.checkerframework.checker.calledmethods.CalledMethodsChecker",
    "org.checkerframework.checker.formatter.FormatterChecker",
    "org.checkerframework.checker.index.IndexChecker",
    "org.checkerframework.checker.interning.InterningChecker",
    "org.checkerframework.checker.lock.LockChecker",
    "org.checkerframework.checker.nullness.NullnessChecker",
    "org.checkerframework.checker.regex.RegexChecker",
    "org.checkerframework.checker.resourceleak.ResourceLeakChecker",
    "org.checkerframework.checker.signature.SignatureChecker",
    "org.checkerframework.checker.signedness.SignednessChecker",
    "org.checkerframework.common.initializedfields.InitializedFieldsChecker",
  ]
  extraJavacArgs = [
    "-Werror",
    // "-Aversion",
    // "-verbose",
    "-AcheckPurityAnnotations",
    "-ArequirePrefixInWarningSuppressions",
    "-AwarnRedundantAnnotations",
    "-AwarnUnneededSuppressions",
  ]
}


// Javadoc

tasks.withType(Javadoc).configureEach {
  options.noTimestamp = true
}

// Removes the generated stylesheet's `@import` of a DejaVu font file.  Javadoc
// writes no "resources/fonts" directory, so the import would be a broken link.
// This is not applied to every Javadoc task; "updateUserOptions" rewrites a
// source file rather than producing a documentation tree.
def stripDejavuFontImport = { Javadoc javadocTask ->
  javadocTask.doLast {
    ant.replaceregexp(match: "@import url\\('resources/fonts/dejavu.css'\\);\\s*", replace: "",
    flags: "g", byline: true) {
      fileset(dir: javadocTask.destinationDir)
    }
  }
}

tasks.named("javadoc", Javadoc) { javadocTask ->
  // Turn Javadoc warnings into errors.
  options.addBooleanOption("Xwerror", true)
  options.addBooleanOption("Xdoclint:all", true)
  // Document private members too, so that doclint checks their documentation.
  options.memberLevel = JavadocMemberLevel.PRIVATE
  options.quiet()
  stripDejavuFontImport(javadocTask)
}

tasks.register("javadocWeb") {
  group = "Documentation"
  description = "Upload API documentation to website."
  dependsOn("javadocWebUpload", "javadocWebChgrp", "javadocWebChmod")
}
// The three tasks below are steps of "javadocWeb", so they have no group and
// thus do not appear in the output of `./gradlew tasks`.
tasks.register("javadocWebUpload", Javadoc) { javadocTask ->
  description = "Write API documentation to the website directory."
  dependsOn("requireJavadoc")
  source = sourceSets.main.allJava
  destinationDir = file("/cse/web/research/plumelib/${project.name}/api")
  classpath = project.sourceSets.main.compileClasspath
  stripDejavuFontImport(javadocTask)
}
// Set permissions
tasks.register("javadocWebChgrp", Exec) {
  description = "Set the Unix group of the website's API documentation."
  mustRunAfter("javadocWebUpload")
  commandLine("chgrp", "-R",  "plse_www", "/cse/web/research/plumelib/${project.name}/api")
  ignoreExitValue = true
}
tasks.register("javadocWebChmod", Exec) {
  description = "Set the Unix permissions of the website's API documentation."
  mustRunAfter("javadocWebUpload")
  commandLine("chmod", "-R",  "g+w", "/cse/web/research/plumelib/${project.name}/api")
  ignoreExitValue = true
}

// This tool-only classpath, its dependency, and the task that uses it are
// declared together, rather than in the "dependencies" block near the top of
// this file, to keep the three parts of "requireJavadoc" in one place.
configurations {
  requireJavadoc
}
dependencies {
  requireJavadoc(libs.require.javadoc)
}
def requireJavadocStamp = layout.buildDirectory.file("requireJavadoc.stamp")
tasks.register("requireJavadoc", JavaExec) {
  group = "Documentation"
  description = "Ensures that Javadoc documentation exists."
  inputs.files(sourceSets.main.allJava)
  // Without a declared output, this task would never be up to date, so it would
  // re-run on every build.  The file's contents do not matter; only its
  // existence and timestamp do.
  outputs.file(requireJavadocStamp)
  mainClass = "org.plumelib.javadoc.RequireJavadoc"
  classpath = configurations.requireJavadoc
  args(sourceSets.main.allJava.srcDirs.collect { it.absolutePath })
  jvmArgs += [
    "--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
    "--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
  ]
  // Runs only if the tool found no problems, so that a failure does not leave
  // behind a stamp file that would mark this task up to date.
  doLast {
    requireJavadocStamp.get().asFile.text = ""
  }
}
tasks.named("check") {
  dependsOn("javadoc", "requireJavadoc")
}

tasks.register("updateUserOptions", Javadoc) {
  dependsOn("assemble")
  group = "Documentation"
  description = "Updates printed documentation of command-line arguments."
  source = sourceSets.main.allJava.files.sort()
  classpath = project.sourceSets.main.compileClasspath
  options.memberLevel = JavadocMemberLevel.PRIVATE
  options.doclet = "org.plumelib.options.OptionsDoclet"
  options.addStringOption("docfile", "${projectDir}/src/main/java/org/plumelib/lookup/Lookup.java")
  options.addStringOption("format", "javadoc")
  // OptionsDoclet's "-i" means "edit the docfile in place"; it takes no value.
  options.addBooleanOption("i", true)
  options.quiet()
  // Overrides the blanket `noTimestamp = true` in the `withType(Javadoc)` block above.
  options.noTimestamp(false)
  title = ""
  // "docletpath" is a List<File>, so setting it resolves the runtime classpath.
  // Do that when the task runs, not while this file is being evaluated, so that
  // merely realizing the task -- as `./gradlew tasks` and an IDE import do --
  // does not resolve dependencies.
  def mainRuntimeClasspath = sourceSets.main.runtimeClasspath
  doFirst {
    options.docletpath = mainRuntimeClasspath.files as List
  }
}


// Emacs support

/* Make Emacs TAGS table */
tasks.register("tags", Exec) {
  group = "Development"
  description = "Run etags to create an Emacs TAGS table"
  commandLine("bash", "-c", "find src/ -name '*.java' | sort | xargs etags")
}
